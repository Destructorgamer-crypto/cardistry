<script>
'use strict';
/* ============ UTILIDADES ============ */
const T=String.raw,Q=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),P=a=>a[R(0,a.length-1)];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const mj=el=>{if(window.renderMathInElement)renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})};
const fr=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;if(d<0){n=-n;d=-d}return d==1?`${n}`:n<0?T`-\frac{${-n}}{${d}}`:T`\frac{${n}}{${d}}`};
const simp=N=>{let a=1,b=N;for(let k=2;k*k<=b;k++)while(b%(k*k)==0){b/=k*k;a*=k}return{a,b}};
const mkR=(a,b,d=1)=>{const g=gcd(a,d)||1;return{a:a/g,b,d:d/g}};
const rtex=r=>{if(r.b==1)return fr(r.a,r.d);const s=r.a<0?'-':'',a=Math.abs(r.a),n=(a==1?'':a)+T`\sqrt{${r.b}}`;return s+(r.d==1?n:T`\frac{${n}}{${r.d}}`)};
const fac=N=>{const r=[];for(let p=2;p<=N;p++){let e=0;while(N%p==0){N/=p;e++}if(e)r.push(e>1?`${p}^{${e}}`:p)}return r.join(T`\cdot `)};
const idx=n=>n==2?'':`[${n}]`;
const lcm=(a,b)=>a*b/gcd(a,b);
/* polinomios en x: {grado:coef} */
const mulP=(p,q)=>{const r={};for(const i in p)for(const j in q)r[+i+ +j]=(r[+i+ +j]||0)+p[i]*q[j];for(const k in r)if(!r[k])delete r[k];return r};
const pTex=p=>{const ks=Object.keys(p).map(Number).sort((a,b)=>b-a);return ks.map((k,i)=>{const c=p[k];const t=(Math.abs(c)==1&&k?'':Math.abs(c))+(k?'x'+(k>1?`^{${k}}`:''):'');return(c<0?'-':i?'+':'')+t}).join('')||'0'};
const pEq=(p,q)=>JSON.stringify(Object.keys(p).map(k=>[k,p[k]]))==JSON.stringify(Object.keys(q).map(k=>[k,q[k]]));
/* ============ ANÁLISIS DE RESPUESTAS ============ */
function pNum(s){s=s.trim().replace(/−/g,'-').replace(/,/g,'.').replace(/\s/g,'');const m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);if(m)return+m[2]?m[1]/m[2]:null;return/^-?\d+(\.\d+)?$/.test(s)?+s:null}
function pRad(s){s=s.toLowerCase().replace(/\s|\*|·/g,'').replace(/−/g,'-').replace(/(sqrt|raiz|r)\(/g,'√(').replace(/√\((\d+)\)/g,'√$1').replace(/[()]/g,'');
 const m=s.match(/^(-?\d*)(?:√(\d+))?(?:\/(\d+))?$/);if(!m||!s)return null;if(!m[2]&&(m[1]===''||m[1]==='-'))return null;
 const a=m[1]===''?1:m[1]==='-'?-1:+m[1],b=m[2]?+m[2]:1,d=m[3]?+m[3]:1;if(!d||!b)return null;return{a,b,d,sq:simp(b).a==1}}
function pPoly(s){s=s.toLowerCase().replace(/\s|\*|·/g,'').replace(/−/g,'-').replace(/²/g,'^2').replace(/³/g,'^3').replace(/-/g,'+-');const o={};
 for(const t of s.split('+')){if(!t)continue;const m=t.match(/^(-?\d*)(x(?:\^(\d+))?)?$/);if(!m||(!m[1]&&!m[2])||(m[1]=='-'&&!m[2]))return null;
 const c=m[1]===''?1:m[1]==='-'?-1:+m[1],e=m[2]?(m[3]?+m[3]:1):0;o[e]=(o[e]||0)+c}
 for(const k in o)if(!o[k])delete o[k];return o}
const NM={N:'ℕ',Z:'ℤ',Q:'ℚ',I:'𝕀',R:'ℝ'};
function chk(e,a){
 if(a==null||a==='')return{n:1};
 if(e.type=='mc')return{ok:+a===e.ans};
 if(e.type=='tf')return{ok:(a==='v')===e.ans};
 if(e.type=='multi'){const A=[...a].sort().join(''),B=[...e.ans].sort().join('');return{ok:A==B||(!!e.opt&&A.replace('N','')==B)}}
 if(e.type=='num'){const v=pNum(a);if(v==null)return{inv:1};return{ok:Math.abs(v-e.ans)<=(e.tol||1e-9)}}
 if(e.type=='rad'){const p=pRad(a);if(!p)return{inv:1};if(!p.sq)return{ok:false,msg:'El radical todavía se puede simplificar.'};const u=mkR(p.a,p.b,p.d);return{ok:u.a==e.ans.a&&u.b==e.ans.b&&u.d==e.ans.d}}
 if(e.type=='poly'){const p=pPoly(a);if(!p)return{inv:1};return{ok:pEq(p,e.ans)}}
}
/* ============ CONSTRUCTORES DE EJERCICIOS ============ */
const num=(q,ans,expl,tol=1e-9,x={})=>({type:'num',q,ans,tol,expl,...x});
const rad=(q,ans,expl,x={})=>({type:'rad',q,ans,expl,...x});
const pol=(q,ans,expl,x={})=>({type:'poly',q,ans,expl,...x});
const tf=(q,ans,expl,x={})=>({type:'tf',q,ans,expl,...x});
const mc=(q,right,wrongs,expl,x={})=>{const ws=[...new Set(wrongs)].filter(w=>w!==right).slice(0,3);const o=sh([right,...ws]);return{type:'mc',q,opts:o,ans:o.indexOf(right),expl,...x}};
const tri=(a,b,c)=>`<svg viewBox="0 0 220 170" class="dg"><polygon points="30,140 190,140 30,30" fill="none" stroke="#7c8cff" stroke-width="2"/><path d="M30,125H45V140" fill="none" stroke="#7c8cff"/><text x="95" y="160">${a}</text><text x="2" y="90">${b}</text><text x="120" y="78">${c}</text></svg>`;
const venn=`<svg viewBox="0 0 420 220" class="dg" style="width:min(460px,100%)"><rect x="2" y="2" width="416" height="216" rx="14" fill="none" stroke="#7c8cff"/><text x="14" y="22">ℝ</text><ellipse cx="150" cy="118" rx="132" ry="88" fill="#6d7bff18" stroke="#6d7bff"/><ellipse cx="150" cy="128" rx="92" ry="60" fill="#9b6dff22" stroke="#9b6dff"/><ellipse cx="150" cy="138" rx="50" ry="32" fill="#3ddc9722" stroke="#3ddc97"/><ellipse cx="345" cy="118" rx="62" ry="62" fill="#ff6b8118" stroke="#ff6b81"/><text x="40" y="60">ℚ  (3/4, 2,5)</text><text x="75" y="92">ℤ  (−5, 0)</text><text x="124" y="134">ℕ</text><text x="118" y="152">1, 2, 7</text><text x="322" y="90">𝕀</text><text x="304" y="120">√2, π</text></svg>`;
/* ============ BANCOS Y GENERADORES (una función por tipo de ejercicio; l = nivel 0,1,2) ============ */
const POOL=[['5','NZQR',0,'Es un entero positivo: natural, entero, racional y real.'],['-5','ZQR',0,'Entero negativo: no es natural.'],['0','ZQR',0,'Es entero. Estar o no en ℕ depende de la convención, por eso se acepta de las dos formas.'],
[T`\frac34`,'QR',0,T`Es una fracción de enteros ($0{,}75$, decimal exacto): racional.`],[T`\sqrt2`,'IR',0,'Raíz no exacta: decimal infinito no periódico, irracional.'],[T`\pi`,'IR',0,T`$\pi$ es irracional (decimales infinitos sin periodo).`],
['2{,}5','QR',0,T`$2{,}5=\frac52$: decimal exacto, racional.`],[T`\sqrt{49}`,'NZQR',0,T`$\sqrt{49}=7$: es natural.`],
[T`-\frac72`,'QR',1,'Fracción no entera: racional.'],[T`\sqrt{16}`,'NZQR',1,T`$\sqrt{16}=4$.`],[T`-\sqrt9`,'ZQR',1,T`$-\sqrt9=-3$: entero negativo.`],[T`\sqrt{10}`,'IR',1,T`10 no es cuadrado perfecto ($3^2=9<10<16=4^2$): irracional.`],
[T`0{,}\overline3`,'QR',1,T`Periódico puro: $0{,}\overline3=\frac13$.`],[T`\frac{12}4`,'NZQR',1,T`$\frac{12}{4}=3$.`],[T`\sqrt{\frac94}`,'QR',1,T`$\sqrt{\frac94}=\frac32$.`],[T`-\sqrt7`,'IR',1,'7 no es cuadrado perfecto: irracional (con el signo menos sigue siéndolo).'],
[T`1{,}2\overline3`,'QR',2,T`Periódico mixto: $1{,}2\overline3=\frac{37}{30}$.`],[T`0{,}\overline{27}`,'QR',2,T`Periódico puro: $0{,}\overline{27}=\frac3{11}$.`],[T`0{,}1010010001\ldots`,'IR',2,'Infinitas cifras sin periodo (el número de ceros crece): irracional.'],
[T`\sqrt[3]{-8}`,'ZQR',2,T`$\sqrt[3]{-8}=-2$ (índice impar, radicando negativo).`],[T`\sqrt[3]9`,'IR',2,'9 no es cubo perfecto: irracional.'],[T`\frac{\sqrt2}2`,'IR',2,T`$\frac{\sqrt2}{2}=\frac1{\sqrt2}$: racional por irracional (no nulo) es irracional.`],
[T`\sqrt2\cdot\sqrt8`,'NZQR',2,T`$\sqrt2\cdot\sqrt8=\sqrt{16}=4$.`],[T`2\pi`,'IR',2,'Un racional no nulo por un irracional es irracional.'],[T`-\frac{15}5`,'ZQR',2,T`$-\frac{15}{5}=-3$.`]];
const multi=l=>{const it=P(POOL.filter(p=>p[2]==l));const s=it[1];return{type:'multi',q:T`Marca todos los conjuntos a los que pertenece $${it[0]}$.`,ans:s,opt:it[0]=='0',expl:`${it[3]} Pertenece a: ${[...s].map(k=>NM[k]).join(', ')}.${it[0]=='0'?' (ℕ opcional según convención)':''}`}};
const TFB=[[T`$\mathbb N\subset\mathbb Z\subset\mathbb Q\subset\mathbb R$.`,1,'Cada conjunto está contenido en el siguiente.'],['Todo número real es racional.',0,T`Falso: $\sqrt2$ y $\pi$ son reales y no racionales.`],[T`$\pi$ es un número racional.`,0,'Falso: es irracional.'],[T`$0{,}\overline3$ es racional.`,1,T`Verdadero: $0{,}\overline3=\frac13$.`],['Todo número entero es natural.',0,T`Falso: $-1$ es entero y no es natural.`],['Un número no puede ser racional e irracional a la vez.',1,T`Verdadero: $\mathbb Q\cap\mathbb I=\varnothing$.`],[T`$\mathbb Q\cup\mathbb I=\mathbb R$.`,1,'Verdadero: los reales son racionales o irracionales.'],['Un decimal con infinitas cifras sin ningún periodo es racional.',0,'Falso: es irracional.'],[T`$\sqrt{16}$ es irracional.`,0,T`Falso: $\sqrt{16}=4$.`],['Todo decimal exacto es racional.',1,T`Verdadero: se escribe como fracción, p. ej. $2{,}5=\frac52$.`],[T`$-3\in\mathbb N$.`,0,'Falso: es entero negativo.']];
const MCB=[['Un número con decimales infinitos y no periódicos es…','irracional','racional','entero','natural'],[T`La fracción $\frac74$ en decimal es…`,'exacto','periódico puro','periódico mixto','irracional'],['El conjunto más pequeño que contiene a −5 es…','ℤ','ℕ','ℚ','𝕀']];
const smallest=l=>{const it=P(POOL.filter(p=>p[2]<=l&&p[0]!='0'));const s=it[1],r=s.includes('N')?'ℕ':s.includes('Z')?'ℤ':s.includes('Q')?'ℚ':'𝕀';return mc(T`¿Cuál es el conjunto más pequeño al que pertenece $${it[0]}$?`,r,['ℕ','ℤ','ℚ','𝕀'],it[3]+` El más pequeño es ${r}.`)};
const irrMC=l=>{const pl=POOL.filter(p=>p[2]<=l),irr=P(pl.filter(p=>p[1][0]=='I')),rat=sh(pl.filter(p=>p[1][0]!='I')).slice(0,3),w=x=>'$'+x[0]+'$';return mc('¿Cuál de estos números es irracional?',w(irr),rat.map(w),irr[3])};
const dec=l=>{const d=R(2,[10,20,40][l]),n=R(1,d-1);if(n%d==0)return null;const dd=d/gcd(n,d);if(dd==1)return null;let r=dd;while(r%2==0)r/=2;while(r%5==0)r/=5;const c=r==1?'Exacto':gcd(dd,10)==1?'Periódico puro':'Periódico mixto';
 return mc(T`¿Cómo es el decimal de $\frac{${n}}{${d}}$?`,c,['Exacto','Periódico puro','Periódico mixto','No periódico (irracional)'],T`Simplificada: $\frac{${n/gcd(n,d)}}{${dd}}$. ${r==1?'El denominador solo tiene factores 2 y 5: decimal exacto.':gcd(dd,10)==1?'El denominador no tiene factores 2 ni 5: periódico puro.':'El denominador tiene 2 o 5 y además otros factores: periódico mixto.'} Toda fracción es racional, nunca irracional.`)};
/* Pitágoras */
const TRI=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29]];
const trip=l=>{const t=P(TRI.slice(0,l==0?2:l==1?3:5)),k=l==0?1:R(1,l==1?2:3);return t.map(x=>x*k)};
const hE=(a,b,c)=>T`$c=\sqrt{${a}^2+${b}^2}=\sqrt{${a*a+b*b}}=${c}$.`,lE=(c,b,a)=>T`$x=\sqrt{${c}^2-${b}^2}=\sqrt{${c*c-b*b}}=${a}$.`;
const CTX=[(a,b,c)=>[T`Una escalera se apoya en una pared: su pie está a ${a} m de la pared y alcanza ${b} m de altura. ¿Cuánto mide la escalera (en m)?`,c,tri(a+' m',b+' m','?'),hE(a,b,c)],
(a,b,c)=>[T`Un rectángulo mide ${a} cm de base y ${b} cm de altura. Calcula su diagonal (en cm).`,c,tri(a,b,'?'),hE(a,b,c)],
(a,b,c)=>[T`Un triángulo isósceles tiene base ${2*b} cm y lados iguales de ${c} cm. Calcula su altura (en cm).`,a,tri(b+' (mitad)','?',c),lE(c,b,a)],
(a,b,c)=>[T`Una antena de ${b} m de altura se sujeta con un cable que toca el suelo a ${a} m de su base. ¿Cuánto mide el cable (en m)?`,c,tri(a+' m',b+' m','?'),hE(a,b,c)],
(a,b,c)=>[T`Calcula la distancia entre A(1, 2) y B(${1+a}, ${2+b}).`,c,tri(a,b,'?'),hE(a,b,c)],
(a,b,c)=>[T`Una pantalla rectangular mide ${a} cm de ancho y ${b} cm de alto. ¿Cuánto mide su diagonal (cm)?`,c,tri(a,b,'?'),hE(a,b,c)]];
/* Radicales equivalentes */
const rdx=(n,a,m)=>T`\sqrt${idx(n)}{${a}^{${m}}}`;
const cmp=()=>{const[n1,n2]=P([[2,3],[2,4],[3,4],[3,6],[2,6]]);let a,b,x,y;do{a=R(2,10);b=R(2,10);x=a**(1/n1);y=b**(1/n2)}while(a==b||Math.abs(x-y)<.02);
 const L=lcm(n1,n2),A=a**(L/n1),B=b**(L/n2),f=T`$\sqrt${idx(n1)}{${a}}$`,g=T`$\sqrt${idx(n2)}{${b}}$`;
 return mc(`¿Cuál es mayor, ${f} o ${g}?`,x>y?f:g,[x>y?g:f,'Son iguales','No se pueden comparar'],T`Índice común ${L}: $\sqrt${idx(n1)}{${a}}=\sqrt[${L}]{${a}^{${L/n1}}}=\sqrt[${L}]{${A}}$ y $\sqrt${idx(n2)}{${b}}=\sqrt[${L}]{${b}^{${L/n2}}}=\sqrt[${L}]{${B}}$. Es mayor el de radicando mayor (${Math.max(A,B)}).`)};
/* Operaciones */
const sumG=l=>{const n=P([2,3,5,6,7]),m=l==2?3:2;let tot=0,s='',s2='';for(let i=0;i<m;i++){const sg=i?P([1,-1]):1,k=l?R(1,5):1,c=l?(l==2?R(1,3):1):R(1,6),v=sg*c*k;tot+=v;
  s+=(i?(sg<0?'-':'+'):'')+(c>1?c:'')+T`\sqrt{${k*k*n}}`;s2+=(i?(sg<0?'-':'+'):'')+(c*k>1?c*k:'')+T`\sqrt{${n}}`}
 if(!tot)return null;return rad(T`Simplifica y calcula: $${s}$.`,mkR(tot,n),T`Simplificamos cada radical: $${s}=${s2}$. Son semejantes, así que sumamos coeficientes: $${tot}\sqrt{${n}}$ = $${rtex(mkR(tot,n))}$.`)};
const NSF=[2,3,5,6,7,10];
/* Racionalización */
const racG=l=>{let a,b,c=1,N=0;if(l==0){a=1;b=P([2,3,5,7])}else if(l==1){a=R(2,9);b=P(NSF)}else{a=R(2,9);b=P([2,3,5,6,7]);c=R(2,4);if(R(0,1))N=c*c*b}

const L=[
{s:T`Los <b>números reales</b> (ℝ) son todos los que se pueden colocar en la recta numérica. Se dividen en <b>racionales</b> (ℚ: se escriben como fracción $\frac ab$; su decimal es exacto, como $0{,}75$, o periódico, como $0{,}\overline3$) e <b>irracionales</b> (𝕀: decimal infinito y no periódico, como $\sqrt2=1{,}41421\ldots$ o $\pi$). Dentro de ℚ está ℤ (…, −2, −1, 0, 1, …) y dentro de ℤ está ℕ (1, 2, 3, …). <b>Convención:</b> según tu clase, ℕ empieza en 1 o incluye el 0; en esta web el 0 se acepta dentro y fuera de ℕ.`,f:[T`\mathbb N\subset\mathbb Z\subset\mathbb Q\subset\mathbb R`,T`\mathbb Q\cup\mathbb I=\mathbb R,\qquad\mathbb Q\cap\mathbb I=\varnothing`],d:venn,
 e:T`$-5$: ℤ, ℚ, ℝ. $0$: ℤ, ℚ, ℝ (y ℕ si lo incluyes). $\frac34=0{,}75$: ℚ, ℝ. $\sqrt2$ y $\pi$: 𝕀, ℝ. $2{,}5=\frac52$: ℚ, ℝ. $\sqrt{49}=7$: ℕ, ℤ, ℚ, ℝ.`,r:[T`Creer que $\sqrt{49}$ es irracional: primero hay que calcular la raíz.`,'Pensar que todo decimal con infinitas cifras es irracional: si se repite, es racional.','Olvidar que un número pertenece a varios conjuntos a la vez.']},
{s:T`Para clasificar un número: 1) <b>simplifícalo</b> (raíces exactas, fracciones reducibles); 2) si es entero, es ℤ (y ℕ si es positivo); 3) si se escribe como fracción o su decimal es exacto o periódico, es ℚ; 4) si es una raíz no exacta o un decimal infinito sin periodo, es 𝕀. Todo número real está en ℝ. Decimal exacto: $0{,}25=\frac14$. Periódico puro: $0{,}\overline3=\frac13$. Periódico mixto: $0{,}1\overline6=\frac16$.`,f:[T`0{,}\overline7=\frac79`,T`1{,}2\overline3=\frac{37}{30}`],d:venn,
 e:T`$\frac{12}4=3$: aunque sea una fracción, es natural. $-\sqrt9=-3$: entero. $\sqrt{10}$: $3^2<10<4^2$, no exacta, irracional.`,r:['Clasificar una fracción sin simplificarla (12/4 = 3).','Creer que toda raíz es irracional.','Decir que −3 es natural.']},
{s:T`En un triángulo rectángulo (con un ángulo de 90°) los lados que forman el ángulo recto son los <b>catetos</b> y el lado opuesto, el mayor, es la <b>hipotenusa</b>. El cuadrado de la hipotenusa es la suma de los cuadrados de los catetos. Para saber si un triángulo es rectángulo, comprueba si el cuadrado del lado mayor es igual a la suma de los cuadrados de los otros dos. En problemas reales busca el triángulo rectángulo oculto: diagonales, alturas, escaleras, distancias.`,f:[T`a^2+b^2=c^2`,T`c=\sqrt{a^2+b^2},\qquad a=\sqrt{c^2-b^2}`],d:tri('a','b','c (hipotenusa)'),
 e:T`Catetos de 6 cm y 8 cm: $c^2=6^2+8^2=36+64=100$, luego $c=\sqrt{100}=10$ cm.`,r:['Sumar los lados sin elevarlos al cuadrado.',T`Para un cateto, sumar en lugar de restar: $a^2=c^2-b^2$.`,'Olvidar la raíz cuadrada al final.']},
{s:T`$a^n$ es multiplicar $a$ por sí mismo $n$ veces ($a$ es la base y $n$ el exponente). Con exponente 0 vale 1 y con exponente negativo se invierte la base. Cuidado con los signos: $(-2)^4=16$, porque el paréntesis mete el signo en la base, pero $-2^4=-16$, porque solo se eleva el 2 y después se cambia el signo.`,f:[T`a^m\cdot a^n=a^{m+n}\qquad\frac{a^m}{a^n}=a^{m-n}\qquad(a^m)^n=a^{m\cdot n}`,T`(ab)^n=a^nb^n\qquad\left(\frac ab\right)^n=\frac{a^n}{b^n}`,T`a^0=1\qquad a^1=a\qquad a^{-n}=\frac1{a^n}\qquad\left(\frac ab\right)^{-n}=\left(\frac ba\right)^n`],
 e:T`$\dfrac{2^5\cdot2^{-2}}{2^{1}}=2^{5-2-1}=2^2=4$.`,r:[T`$(a+b)^n\neq a^n+b^n$.`,'Multiplicar los exponentes en un producto de potencias: se suman.',T`$(-3)^2=9$ pero $-3^2=-9$.`,T`$2^{-3}=\frac18$, no $-8$.`]},
{s:T`Una raíz $\sqrt[n]{a}$ tiene signo radical, <b>índice</b> $n$ (si no se escribe, es 2) y <b>radicando</b> $a$. Es la operación inversa de la potencia: $\sqrt[n]{a}=b$ si $b^n=a$. Toda raíz se escribe como potencia de exponente fraccionario: el exponente del radicando va en el numerador y el índice en el denominador.`,f:[T`\sqrt[n]{a^m}=a^{m/n}`,T`a^{-m/n}=\frac{1}{\sqrt[n]{a^m}}`],
 e:T`$\sqrt{25}=5$; $\sqrt[3]{8}=2$; $16^{1/2}=\sqrt{16}=4$; $8^{2/3}=\sqrt[3]{8^2}=(\sqrt[3]{8})^2=2^2=4$.`,r:[T`Poner el índice en el numerador: en $a^{m/n}$ el índice es el denominador.`,'Olvidar que el exponente negativo invierte la base.']},
{s:T`Para calcular $\sqrt[n]{a}$, busca el número que elevado a $n$ da $a$. Memoriza los <b>cuadrados perfectos</b> (1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144) y los <b>cubos perfectos</b> (1, 8, 27, 64, 125, 216). Si el radicando no es potencia perfecta, la raíz no es exacta (es irracional) y se aproxima entre dos enteros consecutivos. Con índice impar el radicando puede ser negativo; con índice par, un radicando negativo no tiene raíz real.`,f:[T`\sqrt[3]{-27}=-3`,T`\sqrt{-9}\notin\mathbb R`],
 e:T`$\sqrt{50}$: $7^2=49<50<64=8^2$, luego $7<\sqrt{50}<8$; como 50 está muy cerca de 49, $\sqrt{50}\approx7{,}07$.`,r:[T`Decir que $\sqrt{-9}=-3$: $(-3)^2=+9$, no existe en ℝ.`,'Escribir raíces de índice impar con radicando negativo como si no existieran.']},
{s:T`Dos radicales son <b>equivalentes</b> si valen lo mismo. Se obtienen multiplicando (amplificar) o dividiendo (simplificar) el índice y el exponente del radicando por el mismo número, porque no cambia el exponente fraccionario $\frac mn$. Para comparar radicales de distinto índice se reducen a <b>índice común</b> (el mínimo común múltiplo de los índices).`,f:[T`\sqrt[n]{a^m}=\sqrt[nk]{a^{mk}}`,T`\sqrt[6]{a^4}=\sqrt[3]{a^2}`],
 e:T`$\sqrt[3]{2^2}=\sqrt[6]{2^4}$ (×2). $\sqrt[12]{5^8}=\sqrt[3]{5^2}$ (÷4).`,r:['Cambiar solo el índice o solo el exponente.','Sumar el mismo número en lugar de multiplicar.']},
{s:T`<b>Extraer factores:</b> descompón el radicando en factores primos; cada factor cuyo exponente sea mayor o igual que el índice sale de la raíz (los que sobran se quedan dentro). <b>Introducir factores:</b> el número de fuera se eleva al índice y se multiplica por el radicando. Un factor negativo no puede entrar en una raíz de índice par: el signo menos se queda fuera.`,f:[T`\sqrt{a^2b}=a\sqrt b`,T`a\sqrt[n]{b}=\sqrt[n]{a^nb}`],
 e:T`$\sqrt{72}=\sqrt{2^3\cdot3^2}=\sqrt{2^2\cdot2\cdot3^2}=2\cdot3\sqrt2=6\sqrt2$. Al revés: $3\sqrt5=\sqrt{3^2\cdot5}=\sqrt{45}$.`,r:[T`Al introducir, no elevar al índice: $3\sqrt5\neq\sqrt{15}$.`,'Sacar un factor sin dividir bien los exponentes.',T`Meter un signo menos dentro de una raíz cuadrada: $-3\sqrt5=-\sqrt{45}$.`]},
{s:T`Solo se pueden sumar o restar directamente los <b>radicales semejantes</b> (mismo índice y mismo radicando): se suman los coeficientes. A veces hay que simplificar primero para descubrir que lo son. Para multiplicar o dividir radicales del mismo índice se usan las propiedades de las raíces y luego se simplifica. Cuida los signos delante de los paréntesis.`,f:[T`a\sqrt n\pm b\sqrt n=(a\pm b)\sqrt n`,T`\sqrt a\cdot\sqrt b=\sqrt{ab}\qquad\frac{\sqrt a}{\sqrt b}=\sqrt{\frac ab}`],
 e:T`$\sqrt{18}+\sqrt{8}=3\sqrt2+2\sqrt2=5\sqrt2$. $\sqrt2\cdot\sqrt8=\sqrt{16}=4$.`,r:[T`$\sqrt a+\sqrt b\neq\sqrt{a+b}$.`,T`$\sqrt2+\sqrt2=2\sqrt2$, no $\sqrt4$.`,'Perder un signo menos al quitar un paréntesis.']},
{s:T`Racionalizar es eliminar la raíz del denominador sin cambiar el valor de la fracción: se multiplica numerador y denominador por el mismo radical (equivale a multiplicar por 1). Se hace para operar y comparar con más facilidad. Después se simplifica. Si el denominador es un binomio con raíces, se multiplica por su <b>conjugado</b> (cambiando el signo central).`,f:[T`\frac{a}{\sqrt b}=\frac{a\sqrt b}{b}`,T`\frac{1}{\sqrt a+c}=\frac{\sqrt a-c}{a-c^2}`],
 e:T`$\dfrac{6}{\sqrt3}=\dfrac{6\sqrt3}{\sqrt3\cdot\sqrt3}=\dfrac{6\sqrt3}{3}=2\sqrt3$.`,r:['Multiplicar solo el denominador.','Olvidar simplificar el resultado.','En el conjugado, cambiar el signo equivocado.']},
{s:T`Son productos de binomios que se desarrollan directamente. <b>Suma al cuadrado:</b> cuadrado del primero, doble producto, cuadrado del segundo. <b>Diferencia al cuadrado:</b> igual, pero el doble producto lleva signo menos. <b>Suma por diferencia:</b> cuadrado del primero menos cuadrado del segundo (el término central desaparece). Para comprobar el resultado, sustituye $x=1$ o $x=2$ en ambos lados.`,f:[T`(a+b)^2=a^2+2ab+b^2`,T`(a-b)^2=a^2-2ab+b^2`,T`(a+b)(a-b)=a^2-b^2`],
 e:T`$(3x-2)^2=(3x)^2-2\cdot3x\cdot2+2^2=9x^2-12x+4$. Comprobación con $x=1$: $(3-2)^2=1$ y $9-12+4=1$.`,r:[T`$(a+b)^2\neq a^2+b^2$ (falta el doble producto).`,T`Coeficientes: $(3x)^2=9x^2$, no $3x^2$.`,T`$(x-3)^2=x^2-6x+9$, no $x^2-9$.`]}];

const exBox=()=>`<div class="exb"></div><div class="row"><button class="b p ck">Comprobar</button><button class="b hn">Pista</button>`;
function runSess(h,list,o={}){let i=0,ok=0;const show=()=>{if(i>=list.length)return end();const e=list[i];
  h.innerHTML=`<div class="card"><div class="mut">Ejercicio ${i+1} de ${list.length} · ${LV[e.lv]}${o.tag?' · '+TN[e.t]:''}</div><div class="bar"><i style="width:${i/list.length*100}%"></i></div>${exBox()}<button class="b nx">Siguiente ejercicio</button></div><div class="fb" id="fb"></div></div>`;
  const c=h.querySelector('.card');c.querySelector('.fb')||0;attach(c,e,{cb:r=>{if(r)ok++}});c.querySelector('.nx').onclick=()=>{i++;show()}};
 const end=()=>{h.innerHTML=`<div class="card"><h3>Sesión terminada</h3><p>Aciertos al primer intento: <b>${ok} de ${list.length}</b> (${Math.round(ok/list.length*100)}%).</p><div class="row"><button class="b p" id="re">Nueva sesión</button><button class="b" onclick="go('home')">Inicio</button><button class="b" onclick="go('errors')">Mis errores</button></div></div>`;h.querySelector('#re').onclick=()=>o.again?o.again():go(view,arg,tab)};show()}
function build(id,lv,n){const out=[],seen=new Set();for(let i=0;i<n;i++){const l=lv<0?Math.min(2,Math.floor(i*3/n)):lv;let e,t=0;do e=make(id,l);while(seen.has(e.q+e.opts)&&++t<25);seen.add(e.q+e.opts);out.push(e)}return out}
/* ============ VISTAS ============ */
function home(el){const t=tot(),pr=[...Array(11).keys()].map(prog),avg=Math.round(pr.reduce((a,b)=>a+b)/11),ms=[...Array(11).keys()].map(mast),prep=Math.round(ms.reduce((a,b)=>a+b)/11*100),weak=[...Array(11).keys()].sort((a,b)=>ms[a]-ms[b]).slice(0,4);
 const lab=prep<25?'Fase inicial':prep<50?'En progreso':prep<75?'Buen nivel':'Nivel alto';
 el.innerHTML=`<h1>MathLab — Preparación del examen</h1><p class="mut">Matemáticas 4.º ESO · Estudia, practica y comprueba tu nivel.</p>
 ${window.katex?'':'<div class="warn">Las fórmulas necesitan conexión a Internet (KaTeX por CDN). Conéctate y recarga la página.</div>'}
 <div class="row"><button class="b p" onclick="cont()">Continuar estudiando</button><button class="b" onclick="errPractice()">Practicar errores</button><button class="b" onclick="go('exam')">Simulacro de examen</button><button class="b" onclick="go('mental')">Reto de cálculo mental</button></div>
 <div class="stats"><div class="card stat"><b>${avg}%</b>Temario completado<div class="bar"><i style="width:${avg}%"></i></div></div><div class="card stat"><b>${t.o}</b>respuestas correctas de ${t.d}</div><div class="card stat"><b>${prep}%</b>Preparación estimada (${lab})<div class="bar"><i style="width:${prep}%"></i></div></div><div class="card stat"><b>${fmtT(S.time)}</b>Tiempo de práctica</div></div>
 <div class="card"><h3>Temas que más necesitas practicar</h3>${weak.map(i=>`<div class="row"><span style="flex:1">${i+1}. ${TN[i]}</span><span class="mut">${tp(i).done?Math.round(tp(i).ok/tp(i).done*100)+'% acierto':'sin practicar'}</span><button class="b s" onclick="go('topic',${i},'practice')">Practicar</button></div>`).join('')}</div>
 <h2>Temas del examen</h2><div class="grid">${TN.map((n,i)=>`<div class="card tc" onclick="go('topic',${i})"><div class="mut">Tema ${i+1} · ${CA[i]}</div><h3>${n}</h3><div class="bar"><i style="width:${prog(i)}%"></i></div><div class="mut">Progreso ${prog(i)}% · Dominio ${tp(i).done?Math.round(tp(i).ok/tp(i).done*100):0}% · ${tp(i).done} ejercicios</div></div>`).join('')}</div>
 <p class="mut">La preparación estimada es orientativa: se calcula con tus resultados en esta web y no predice tu nota real.</p>
 <div class="row"><button class="b" onclick="reset()">Reiniciar progreso</button></div>`}
function cont(){let i=S.last;if(prog(i)>=100)i=[...Array(11).keys()].find(k=>prog(k)<100)??0;go('topic',i,tp(i).st?'practice':'learn')}
function reset(){if(confirm('¿Seguro que quieres borrar todo tu progreso? Esta acción no se puede deshacer.')){S={tp:{},wrong:[],sims:[],time:0,mental:{done:0,ok:0},last:0};save();render()}}
function topic(el){const i=arg;el.innerHTML=`<div class="mut">Tema ${i+1} · ${CA[i]}</div><h1>${TN[i]}</h1><div class="bar"><i style="width:${prog(i)}%"></i></div><div class="row"><button class="b ${tab=='learn'?'act':''}" onclick="go('topic',${i},'learn')">Aprender</button><button class="b ${tab=='practice'?'act':''}" onclick="go('topic',${i},'practice')">Practicar</button>${i>0?`<button class="b s" onclick="go('topic',${i-1})">← Anterior</button>`:''}${i<10?`<button class="b s" onclick="go('topic',${i+1})">Siguiente →</button>`:''}</div><div id="tb"></div>`;
 tab=='learn'?learn(Q('#tb'),i):practice(Q('#tb'),i)}
function learn(h,i){const l=L[i];h.innerHTML=`<div class="card"><h3>1. Explicación</h3><p>${l.s}</p>${l.d||''}</div><div class="card"><h3>2. Fórmulas importantes</h3>${l.f.map(f=>`<div class="fm">$$${f}$$</div>`).join('')}</div><div class="card"><h3>3. Ejemplo resuelto</h3><p>${l.e}</p></div><div class="card"><h3>4. Errores frecuentes</h3><ul>${l.r.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><h3>5. Comprueba que lo has entendido</h3><div id="q1"></div><hr style="border-color:#2a3060"><div id="q2"></div></div><div class="row"><button class="b p" id="gp">6. Pasar a practicar</button></div>`;
 ['#q1','#q2'].forEach(s=>{const c=h.querySelector(s);c.innerHTML=exBox()+'</div><div class="fb"></div>';attach(c,make(i,0))});
 h.querySelector('#gp').onclick=()=>{tp(i).st=1;save();go('topic',i,'practice')};mj(h)}
function practice(h,i){h.innerHTML=`<div class="card"><h3>Practicar</h3><div class="row"><label>Dificultad <select id="lv"><option value="-1">Progresiva (fácil → difícil)</option><option value="0">Fácil</option><option value="1">Medio</option><option value="2">Difícil</option></select></label><label>Ejercicios <select id="nn"><option>15</option><option>20</option><option>30</option></select></label><button class="b p" id="go">Empezar</button></div><p class="mut">Los ejercicios se generan al azar cada vez y las opciones se mezclan. Pista = ayuda progresiva. Cuenta el primer intento.</p></div><div id="ss"></div>`;
 h.querySelector('#go').onclick=()=>{const lv=+h.querySelector('#lv').value,n=+h.querySelector('#nn').value,st=()=>runSess(h.querySelector('#ss'),build(i,lv,n),{again:st});st()}}
function errPractice(){if(!S.wrong.length){go('errors');return}go('errors');Q('#rp').click()}
function errors(el){const by=TN.map((n,i)=>[i,S.wrong.filter(w=>w.t==i).length]).filter(x=>x[1]);
 el.innerHTML=`<h1>Mis errores</h1>${S.wrong.length?`<div class="card"><p>Tienes <b>${S.wrong.length}</b> ejercicios fallados pendientes. Si aciertas uno al primer intento, desaparece de la lista.</p><p class="mut">${by.map(x=>TN[x[0]]+': '+x[1]).join(' · ')}</p><div class="row"><button class="b p" id="rp">Repetir ejercicios fallados</button><button class="b" id="cl">Vaciar lista</button></div></div><div id="ss"></div><div id="ls">${S.wrong.slice().reverse().slice(0,30).map(w=>`<details class="card"><summary>${TN[w.t]}</summary>${w.svg||''}<div class="q">${w.q}</div>${w.opts?'<ul>'+w.opts.map(o=>`<li>${o}</li>`).join('')+'</ul>':''}<div class="fb">${w.expl}</div></details>`).join('')}</div>`:'<div class="card">No tienes errores guardados. Cuando falles ejercicios, aparecerán aquí.</div>'}`;
 if(S.wrong.length){Q('#rp').onclick=()=>{const st=()=>{const l=sh(S.wrong).slice(0,20);if(!l.length)return go('errors');Q('#ls').style.display='none';runSess(Q('#ss'),l,{tag:1,again:()=>go('errors')})};st()};Q('#cl').onclick=()=>{if(confirm('¿Vaciar la lista de errores?')){S.wrong=[];save();render()}}}}
/* ----- Simulacro ----- */
function exam(el){const s=S.sims.slice(-5).reverse();el.innerHTML=`<h1>Simulacro de examen</h1><div class="card"><div class="row"><button class="b" data-n="11">Corto (11)</button><button class="b" data-n="22">Medio (22)</button><button class="b" data-n="33">Completo (33)</button><label>Preguntas <input type="number" id="n" min="11" max="55" value="22" style="width:80px"></label></div><div class="row"><label class="op"><input type="checkbox" id="cd"><span>Cuenta atrás</span></label><label>Minutos <input type="number" id="mn" min="1" max="180" value="33" style="width:80px"></label></div><p class="mut">Todos los temas con reparto equilibrado y dificultad mezclada. Sin pistas ni soluciones hasta entregar. Puedes dejar preguntas en blanco y volver.</p><button class="b p" id="st">Empezar simulacro</button></div>
 ${s.length?`<div class="card"><h3>Últimos simulacros</h3><table>${s.map(x=>`<tr><td>${x.d}</td><td>${x.n} preguntas</td><td><b>${x.nota}</b>/10</td></tr>`).join('')}</table></div>`:''}`;
 el.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{Q('#n').value=b.dataset.n;Q('#mn').value=Math.round(b.dataset.n*1.5)});Q('#n').oninput=()=>Q('#mn').value=Math.round(Q('#n').value*1.5);
 Q('#st').onclick=()=>{const n=Math.max(11,Math.min(55,+Q('#n').value||22));examRun(el,n,Q('#cd').checked?Math.max(1,+Q('#mn').value||30)*60:0)}}
function examRun(el,n,secs){const qs=sh([...Array(n).keys()]).map(i=>make(i%11,(i+Math.floor(i/11))%3));let i=0,left=secs,done=0;const ans=Array(n).fill(null);
 const draw=()=>{el.innerHTML=`<div class="row"><b>Pregunta ${i+1}/${n}</b><span class="mut" id="tm" style="margin-left:auto">${secs?mmss(left):'sin límite de tiempo'}</span></div><div class="g">${qs.map((q,k)=>`<button class="b ${ans[k]?'an':''} ${k==i?'act':''}" data-k="${k}">${k+1}</button>`).join('')}</div><div class="card"><div class="mut">${TN[qs[i].t]}</div><div id="eb"></div></div><div class="row"><button class="b" id="pv">Anterior</button><button class="b" id="nx">Siguiente</button><button class="b p" id="fn" style="margin-left:auto">Entregar examen</button></div>`;
  renderEx(Q('#eb'),qs[i],ans[i]);const sv=()=>{const a=getAns(Q('#eb'),qs[i]);ans[i]=a===''?null:a};
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{sv();i=+b.dataset.k;draw()});Q('#pv').onclick=()=>{sv();i=(i+n-1)%n;draw()};Q('#nx').onclick=()=>{sv();i=(i+1)%n;draw()};Q('#fn').onclick=()=>{sv();const u=ans.filter(a=>a==null).length;if(!u||confirm(`Tienes ${u} pregunta(s) sin responder. ¿Entregar igualmente?`))finish()};mj(el)};
 const finish=()=>{timers.forEach(clearInterval);timers=[];const by=TN.map(()=>[0,0]);let ok=0;const rs=qs.map((q,k)=>{const r=chk(q,ans[k]),o=r.ok===true;by[q.t][1]++;if(o){ok++;by[q.t][0]++}rec(q,o);return o});
  const nota=Math.round(ok/n*100)/10,d=new Date().toLocaleDateString('es-ES');S.sims.push({d,n,nota});S.sims=S.sims.slice(-10);save();
  el.innerHTML=`<h1>Resultado del simulacro</h1><div class="card"><div class="stat"><b>${nota}/10</b>${ok} de ${n} correctas</div></div><div class="card"><h3>Puntos por tema</h3><table>${by.map((x,t)=>x[1]?`<tr><td>${TN[t]}</td><td>${(x[0]*10/n).toFixed(2)} / ${(x[1]*10/n).toFixed(2)}</td><td class="${x[0]/x[1]<.6?'bad':'good'}">${Math.round(x[0]/x[1]*100)}%</td></tr>`:'').join('')}</table><p><b>Temas a repasar:</b> ${by.map((x,t)=>x[1]&&x[0]/x[1]<.6?`<a href="#" onclick="go('topic',${t},'practice');return false">${TN[t]}</a>`:'').filter(Boolean).join(', ')||'ninguno por debajo del 60%.'}</p></div><div class="row"><button class="b p" onclick="go('exam')">Otro simulacro</button><button class="b" onclick="go('errors')">Mis errores</button></div><h2>Corrección paso a paso</h2>${qs.map((q,k)=>`<details class="card"><summary>${k+1}. ${TN[q.t]} — <b class="${rs[k]?'good':'bad'}">${rs[k]?'correcta':'incorrecta'}</b></summary>${q.svg||''}<div class="q">${q.q}</div>${q.opts?'<ul>'+q.opts.map(o=>`<li>${o}</li>`).join('')+'</ul>':''}<p>Tu respuesta: ${ansTxt(q,ans[k])}${q.type=='mc'?'<br>Correcta: '+q.opts[q.ans]:''}</p><div class="fb">${q.expl}</div></details>`).join('')}`;mj(el)};
 draw();if(secs)timers.push(setInterval(()=>{left--;const t=Q('#tm');if(t)t.textContent=mmss(Math.max(0,left));if(left<=0){const a=getAns(Q('#eb')||document,qs[i]);finish()}},1000))}
/* ----- Cálculo mental ----- */
const pr=n=>n<0?`(${n})`:n,ft=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return d==1?`${n}`:`${n}/${d}`};
const MG=[()=>{const a=R(-9,9),b=R(-9,9);return[T`$${a}+${pr(b)}$`,a+b]},()=>{const a=R(-12,12),b=R(-12,12);return[T`$${a}-${pr(b)}$`,a-b]},()=>{const a=R(2,12),b=R(-9,9);return[T`$${a}\cdot${pr(b)}$`,a*b]},()=>{const b=R(2,12),k=R(2,12);return[T`$${b*k}\div${b}$`,k]},
()=>{const b=R(2,5),e=R(2,4);return R(0,1)?[T`$${b}^{${e}}$`,b**e]:[T`$(-${b})^{${e}}$`,(-b)**e]},()=>{const k=R(1,13);return[T`$\sqrt{${k*k}}$`,k]},()=>{const k=R(-5,5);return[T`$\sqrt[3]{${k**3}}$`,k]},
()=>{const a=R(1,3),b=P([2,3,4,5,6]),c=R(1,3),d=P([2,3,4,5,6]),s=R(0,1)?1:-1,n=a*d+s*c*b,dd=b*d;return[T`$\frac{${a}}{${b}}${s<0?'-':'+'}\frac{${c}}{${d}}$ (fracción a/b)`,n/dd,ft(n,dd)]},
()=>{const a=R(1,4),b=R(2,5),c=R(1,4),d=R(2,5);return[T`$\frac{${a}}{${b}}\cdot\frac{${c}}{${d}}$ (fracción a/b)`,a*c/(b*d),ft(a*c,b*d)]},()=>{const a=R(2,9),b=R(2,5),c=R(-5,5);return[T`$${a}+${b}\cdot${pr(c)}$`,a+b*c]},()=>{const k=R(2,9),e=R(2,3),b=R(2,4);return[T`$\sqrt{${k*k}}+${b}^{${e}}$`,k+b**e]},
()=>{const b=R(2,5),e=R(1,3);return[T`$${b}^{-${e}}$ (fracción a/b)`,1/b**e,'1/'+b**e]},()=>{const a=R(2,9),b=R(2,9);return[T`$(${a}-${b})^2-${a*a}$`,(a-b)**2-a*a]},()=>{const a=R(2,5),m=R(1,4),n=R(1,4);return[T`$${a}^{${m}}\cdot${a}^{${n}}\div${a}^{${m+n-1}}$`,a]},()=>{const t=P([20,30,40,50]),d=R(1,2);return[T`$${t+d}^2$`,(t+d)**2]},()=>{const k=R(2,9);return[T`$(-${k})^2-${k}^2$`,0]}];
function mental(el){el.innerHTML=`<h1>Reto de cálculo mental</h1><div class="card"><p>Sin calculadora. Una pregunta cada vez: Enter para comprobar y Enter para pasar a la siguiente. Fracciones como a/b.</p><div class="row"><label>Duración (minutos) <input type="number" id="mn" min="1" max="60" value="15" style="width:80px"></label><button class="b p" id="st">Empezar reto</button></div></div>`;
 Q('#st').onclick=()=>{let left=Math.max(1,Math.min(60,+Q('#mn').value||15))*60,ok=0,n=0,cur,err=[],stage=0;
  const nxt=()=>{cur=P(MG)();stage=0;n=n;el.innerHTML=`<div class="row"><b>Reto de cálculo mental</b><span id="tm" style="margin-left:auto">${mmss(left)}</span></div><div class="card"><div class="mut">Aciertos: ${ok} / ${n}</div><div class="q" style="font-size:24px">${cur[0]}</div><div class="row"><input class="ai" id="an" autocomplete="off" placeholder="Respuesta"><button class="b p" id="ck">Comprobar</button><button class="b" id="fn">Finalizar</button></div><div class="fb" id="fb" style="display:none"></div></div>`;mj(el);const i=Q('#an');i.focus();Q('#ck').onclick=act;Q('#fn').onclick=end;i.onkeydown=e=>{if(e.key=='Enter')act()}};
  const act=()=>{if(stage){return nxt()}const a=Q('#an').value,v=pNum(a);if(v==null){const f=Q('#fb');f.style.display='block';f.className='fb';f.textContent='Escribe un número o una fracción a/b.';return}
   const o=Math.abs(v-cur[1])<1e-9;n++;S.mental.done++;if(o){ok++;S.mental.ok++}else err.push([cur[0],a,cur[2]||String(cur[1])]);save();stage=1;const f=Q('#fb');f.style.display='block';f.className='fb '+(o?'ok':'ko');f.innerHTML=o?'<b class="good">Correcto.</b> Enter para continuar.':`<b class="bad">Incorrecto.</b> Respuesta: ${cur[2]||cur[1]}. Enter para continuar.`;Q('#ck').textContent='Siguiente';Q('#an').onkeydown=e=>{if(e.key=='Enter')nxt()}};
  const end=()=>{timers.forEach(clearInterval);timers=[];el.innerHTML=`<h1>Resultado del reto</h1><div class="card"><div class="stat"><b>${n?Math.round(ok/n*100):0}%</b>${ok} aciertos de ${n} preguntas</div></div>${err.length?`<div class="card"><h3>Errores</h3>${err.map(e=>`<div>${e[0]} → tu respuesta: <span class="bad">${e[1]}</span> · correcta: <b class="good">${e[2]}</b></div>`).join('')}</div>`:''}<div class="row"><button class="b p" onclick="go('mental')">Repetir con preguntas nuevas</button><button class="b" onclick="go('home')">Inicio</button></div>`;mj(el)};
  nxt();timers.push(setInterval(()=>{left--;const t=Q('#tm');if(t)t.textContent=mmss(Math.max(0,left));if(left<=0)end()},1000))}}
/* ============ INICIO ============ */
function init(){setInterval(()=>{if(['topic','exam','mental'].includes(view)&&!document.hidden){S.time++;if(S.time%10==0)save()}},1000);render()}
window.addEventListener('load',init);
</script>
